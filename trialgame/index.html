<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Stone Fall</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            #TutContainer {
                width: 100vw;
                height: 100vh;
            }

            #vignette {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                pointer-events: none;
                background: radial-gradient(circle at center, transparent 60%, rgba(255, 0, 0, 0.6) 100%);
                opacity: 0;
                z-index: 10;
            }

            @keyframes vignetteFlash {
                0% {
                    opacity: 0;
                }

                20% {
                    opacity: 1;
                }

                100% {
                    opacity: 0;
                }
            }

            .vignette-active {
                animation: vignetteFlash 1.5s ease-out forwards;
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/86/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.86.0/examples/js/loaders/FBXLoader.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/imaya/zlib.js@master/bin/inflate.min.js"></script>
    </head>

    <body>
        <div id="TutContainer"></div>
        <div id="vignette"></div>
        <script>
            var sceneWidth;
            var sceneHeight;
            var camera;
            var scene;
            var renderer;
            var dom;
            var sun;
            var ground;
            var rollingGroundSphere;
            var heroSphere;
            var mixer;
            var rollingSpeed = 0.008;
            var heroRollingSpeed;
            var worldRadius = 26;
            var heroRadius = 0.2;
            var sphericalHelper;
            var pathAngleValues;
            var heroBaseY = 1.8;
            var bounceValue = 0.1;
            var gravity = 0.005;
            var leftLane = -1;
            var rightLane = 1;
            var middleLane = 0;
            var currentLane;
            var clock;
            var jumping;
            var treeReleaseInterval = 0.5;
            var lastTreeReleaseTime = 0;
            var treesInPath;
            var treesPool;
            var hasCollided;
            var touchStartX = 0;
            var touchStartY = 0;
            var touchThreshold = 50;

            init();

            function init() {
                createScene();
                update();
            }

            function createScene() {
                hasCollided = false;
                treesInPath = [];
                treesPool = [];
                clock = new THREE.Clock();
                clock.start();
                heroRollingSpeed = (rollingSpeed * worldRadius / heroRadius) / 5;
                sphericalHelper = new THREE.Spherical();
                pathAngleValues = [1.52, 1.57, 1.62];
                sceneWidth = window.innerWidth;
                sceneHeight = window.innerHeight;
                scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x87CEEB, 0.10);
                scene.background = new THREE.Color(0x87CEEB);
                camera = new THREE.PerspectiveCamera(90, sceneWidth / sceneHeight, 0.1, 1000); // Changed FOV to 90
                renderer = new THREE.WebGLRenderer({ alpha: true });
                renderer.setClearColor(0xfffafa, 1);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.setSize(sceneWidth, sceneHeight);
                dom = document.getElementById('TutContainer');
                dom.appendChild(renderer.domElement);
                createTreesPool();
                addWorld();
                loadFishModel();
                addLight();
                addClouds();

                camera.position.z = 8; // Moved back from 6
                camera.position.y = 3.5;

                window.addEventListener('resize', onWindowResize, false);
                document.onkeydown = handleKeyDown;
                dom.addEventListener('touchstart', handleTouchStart, false);
                dom.addEventListener('touchend', handleTouchEnd, false);
            }

            function addClouds() {
                var cloudGeometry = new THREE.SphereGeometry(1, 16, 16);
                var cloudMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, opacity: 0.8, transparent: true });
                for (var i = 0; i < 10; i++) {
                    var cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
                    cloud.position.set(
                        (Math.random() - 0.5) * 50,
                        10 + Math.random() * 10,
                        -10 - Math.random() * 20
                    );
                    cloud.scale.setScalar(0.5 + Math.random() * 1.5);
                    scene.add(cloud);
                }
            }

            function handleTouchStart(event) {
                var touch = event.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }

            function handleTouchEnd(event) {
                if (jumping) return;
                var touch = event.changedTouches[0];
                var touchEndX = touch.clientX;
                var touchEndY = touch.clientY;
                var deltaX = touchEndX - touchStartX;
                var deltaY = touchEndY - touchStartY;
                var absDeltaX = Math.abs(deltaX);
                var absDeltaY = Math.abs(deltaY);

                if (absDeltaX > absDeltaY && absDeltaX > touchThreshold) {
                    if (deltaX > 0) {
                        handleLaneChange(1);
                    } else {
                        handleLaneChange(-1);
                    }
                } else if (absDeltaY > absDeltaX && absDeltaY > touchThreshold && deltaY < 0) {
                    bounceValue = 0.1;
                    jumping = true;
                }
            }

            function handleLaneChange(direction) {
                var validMove = true;
                if (direction < 0) {
                    if (currentLane == middleLane) {
                        currentLane = leftLane;
                    } else if (currentLane == rightLane) {
                        currentLane = middleLane;
                    } else {
                        validMove = false;
                    }
                } else {
                    if (currentLane == middleLane) {
                        currentLane = rightLane;
                    } else if (currentLane == leftLane) {
                        currentLane = middleLane;
                    } else {
                        validMove = false;
                    }
                }
                if (validMove) {
                    jumping = true;
                    bounceValue = 0.06;
                }
            }

            function createTreesPool() {
                var maxTreesInPool = 10;
                for (var i = 0; i < maxTreesInPool; i++) {
                    var newTree = createRock();
                    treesPool.push(newTree);
                }
            }

            function handleKeyDown(keyEvent) {
                if (jumping) return;
                var validMove = true;
                if (keyEvent.keyCode === 37) {
                    handleLaneChange(-1);
                } else if (keyEvent.keyCode === 39) {
                    handleLaneChange(1);
                } else {
                    if (keyEvent.keyCode === 38) {
                        bounceValue = 0.1;
                        jumping = true;
                    }
                    validMove = false;
                }
            }

            function loadFishModel() {
                var loader = new THREE.FBXLoader();
                loader.load(
                    'FishAnimated.fbx',
                    function (object) {
                        jumping = false;
                        heroSphere = object;
                        console.log("Loaded FBX animations:", heroSphere.animations);
                        heroSphere.traverse(function (child) {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                const textureLoader = new THREE.TextureLoader();
                                child.material = new THREE.MeshStandardMaterial({
                                    map: textureLoader.load('texture.jpeg'),
                                    metalness: 0.3,
                                    roughness: 1,
                                    shading: THREE.SmoothShading
                                });
                            }
                        });
                        heroSphere.scale.set(0.005, 0.005, 0.005);
                        heroSphere.position.y = heroBaseY;
                        heroSphere.position.z = 4.8;
                        currentLane = middleLane;
                        heroSphere.position.x = currentLane;
                        heroSphere.rotation.y = Math.PI;
                        scene.add(heroSphere);

                        mixer = new THREE.AnimationMixer(heroSphere);
                        if (heroSphere.animations && heroSphere.animations.length > 0) {
                            var clip = heroSphere.animations[0];
                            var action = mixer.clipAction(clip);
                            action.setLoop(THREE.LoopRepeat, Infinity);
                            action.play();
                            console.log("Animation started for fish model. Clip name:", clip.name || 'Unnamed');
                        } else {
                            console.log("No animations found in FBX. Check export settings.");
                        }
                    },
                    function (xhr) {
                        console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                    },
                    function (error) {
                        console.error('An error occurred while loading the FBX model:', error);
                    }
                );
            }

            function addWorld() {
                var sides = 64;
                var tiers = 64;
                var sphereGeometry = new THREE.SphereGeometry(worldRadius, sides, tiers);
                var waterMaterial = new THREE.MeshStandardMaterial({
                    color: 0x297aa6,
                    opacity: 0.8,
                    metalness: 0.8,
                    roughness: 0.85,
                    transparent: true,
                    shading: THREE.SmoothShading
                });

                var vertexIndex;
                var vertexVector = new THREE.Vector3();
                var nextVertexVector = new THREE.Vector3();
                var firstVertexVector = new THREE.Vector3();
                var offset = new THREE.Vector3();
                var currentTier = 1;
                var lerpValue = 0.5;
                var heightValue;
                var maxHeight = 0.07;
                for (var j = 1; j < tiers - 2; j++) {
                    currentTier = j;
                    for (var i = 0; i < sides; i++) {
                        vertexIndex = (currentTier * sides) + 1;
                        vertexVector = sphereGeometry.vertices[i + vertexIndex].clone();
                        if (j % 2 !== 0) {
                            if (i == 0) {
                                firstVertexVector = vertexVector.clone();
                            }
                            nextVertexVector = sphereGeometry.vertices[i + vertexIndex + 1].clone();
                            if (i == sides - 1) {
                                nextVertexVector = firstVertexVector;
                            }
                            lerpValue = (Math.random() * (0.75 - 0.25)) + 0.25;
                            vertexVector.lerp(nextVertexVector, lerpValue);
                        }
                        heightValue = (Math.random() * maxHeight) - (maxHeight / 2);
                        offset = vertexVector.clone().normalize().multiplyScalar(heightValue);
                        sphereGeometry.vertices[i + vertexIndex] = (vertexVector.add(offset));
                    }
                }
                rollingGroundSphere = new THREE.Mesh(sphereGeometry, waterMaterial);
                rollingGroundSphere.receiveShadow = true;
                rollingGroundSphere.castShadow = false;
                rollingGroundSphere.rotation.z = -Math.PI / 2;
                scene.add(rollingGroundSphere);
                rollingGroundSphere.position.y = -24;
                rollingGroundSphere.position.z = 2;
                addWorldTrees();
            }

            function addLight() {
                var hemisphereLight = new THREE.HemisphereLight(0xadd8e6, 0x228b22, 1.0);
                scene.add(hemisphereLight);
                sun = new THREE.DirectionalLight(0xcdc1c5, 1.2);
                sun.position.set(10, 8, -5);
                sun.castShadow = true;
                sun.shadow.mapSize.width = 256;
                sun.shadow.mapSize.height = 256;
                sun.shadow.camera.near = 0.5;
                sun.shadow.camera.far = 50;
                scene.add(sun);
                var fillLight = new THREE.DirectionalLight(0xcdc1c5, 0.5);
                fillLight.position.set(-10, 6, -5);
                fillLight.castShadow = true;
                fillLight.shadow.mapSize.width = 256;
                fillLight.shadow.mapSize.height = 256;
                fillLight.shadow.camera.near = 0.5;
                fillLight.shadow.camera.far = 50;
                scene.add(fillLight);
            }

            function addPathTree() {
                var options = [0, 1, 2];
                var lane = Math.floor(Math.random() * 3);
                addTree(true, lane);
                options.splice(lane, 1);
                if (Math.random() > 0.5) {
                    lane = Math.floor(Math.random() * 2);
                    addTree(true, options[lane]);
                }
            }

            function addWorldTrees() {
                var numTrees = 36;
                var gap = 6.28 / 36;
                for (var i = 0; i < numTrees; i++) {
                    addTree(false, i * gap, true);
                    addTree(false, i * gap, false);
                }
            }

            function addTree(inPath, row, isLeft) {
                var newTree;
                if (inPath) {
                    if (treesPool.length == 0) return;
                    newTree = treesPool.pop();
                    newTree.visible = true;
                    treesInPath.push(newTree);
                    sphericalHelper.set(worldRadius - 0.3, pathAngleValues[row], -rollingGroundSphere.rotation.x + 4);
                } else {
                    newTree = createRock();
                    var forestAreaAngle = 0;
                    if (isLeft) {
                        forestAreaAngle = 1.68 + Math.random() * 0.1;
                    } else {
                        forestAreaAngle = 1.46 - Math.random() * 0.1;
                    }
                    sphericalHelper.set(worldRadius - 0.3, forestAreaAngle, row);
                }
                newTree.position.setFromSpherical(sphericalHelper);
                var rollingGroundVector = rollingGroundSphere.position.clone().normalize();
                var treeVector = newTree.position.clone().normalize();
                newTree.quaternion.setFromUnitVectors(treeVector, rollingGroundVector);
                newTree.rotation.x += (Math.random() * (2 * Math.PI / 10)) + -Math.PI / 10;
                rollingGroundSphere.add(newTree);
            }

            function createRock() {
                var sides = 8;
                var rockGeometry = new THREE.DodecahedronGeometry(0.5, 0);
                var rockMaterial = new THREE.MeshStandardMaterial({
                    color: 0x808080,
                    roughness: 0.9,
                    metalness: 0,
                    shading: THREE.SmoothShading
                });
                var rock = new THREE.Mesh(rockGeometry, rockMaterial);
                rock.castShadow = true;
                rock.receiveShadow = false;
                rock.position.y = 0.5;
                rock.scale.set(0.8 + Math.random() * 0.4, 0.8 + Math.random() * 0.4, 0.8 + Math.random() * 0.4);
                return rock;
            }

            function update() {
                var delta = clock.getDelta();
                rollingGroundSphere.rotation.x += rollingSpeed;

                if (heroSphere) {
                    if (heroSphere.position.y <= heroBaseY - 0.3) {
                        jumping = false;
                        bounceValue = (Math.random() * 0.04) + 0.005;
                    }
                    heroSphere.position.y += bounceValue;
                    heroSphere.position.x = THREE.Math.lerp(heroSphere.position.x, currentLane, 2 * delta);
                    bounceValue -= gravity;

                    var time = clock.getElapsedTime();
                    var targetRotationY = Math.PI + Math.sin(time * 4) * 0.15;
                    heroSphere.rotation.y = THREE.Math.lerp(heroSphere.rotation.y, targetRotationY, 0.1);

                    if (mixer) {
                        mixer.update(delta);
                    }
                }
                if (clock.getElapsedTime() > treeReleaseInterval) {
                    clock.start();
                    addPathTree();
                }
                doTreeLogic();
                render();
                requestAnimationFrame(update);
            }

            function doTreeLogic() {
                var oneTree;
                var treePos = new THREE.Vector3();
                var treesToRemove = [];
                treesInPath.forEach(function (element, index) {
                    oneTree = treesInPath[index];
                    treePos.setFromMatrixPosition(oneTree.matrixWorld);
                    if (treePos.z > 6 && oneTree.visible) {
                        treesToRemove.push(oneTree);
                    } else {
                        if (heroSphere && treePos.distanceTo(heroSphere.position) <= 0.6) {
                            console.log("hit");
                            hasCollided = true;
                            var vignette = document.getElementById('vignette');
                            vignette.classList.remove('vignette-active');
                            void vignette.offsetWidth;
                            vignette.classList.add('vignette-active');
                        }
                    }
                });
                var fromWhere;
                treesToRemove.forEach(function (element, index) {
                    oneTree = treesToRemove[index];
                    fromWhere = treesInPath.indexOf(oneTree);
                    treesInPath.splice(fromWhere, 1);
                    treesPool.push(oneTree);
                    oneTree.visible = false;
                    console.log("remove rock");
                });
            }

            function render() {
                renderer.render(scene, camera);
            }

            function gameOver() {
                // Placeholder for future game over logic
            }

            function onWindowResize() {
                sceneHeight = window.innerHeight;
                sceneWidth = window.innerWidth;
                renderer.setSize(sceneWidth, sceneHeight);
                camera.aspect = sceneWidth / sceneHeight;
                camera.updateProjectionMatrix();
            }
        </script>
    </body>

</html>
