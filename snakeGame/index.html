<!DOCTYPE html>
<html>

  <head>
    <title>Snake Game</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
      @font-face {
        font-family: 'Snake';
        src: url('snake.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
      }

      body {
        background: white;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Snake', Arial, sans-serif;
      }

      canvas {
        display: block;
        background: white;
      }
    </style>
  </head>

  <body>
    <canvas id="game"></canvas>
    <script>
      var canvas = document.getElementById('game');
      var context = canvas.getContext('2d');

      if (!context) {
        console.error('Canvas context not initialized. Check if canvas element exists.');
        alert('Error: Canvas not supported or failed to initialize.');
      }

      var grid;
      var gameState = 'start';
      var score = 0;
      var firstMove = true;
      var cols;
      var rows;

      var snake = {
        gx: 0,
        gy: 0,
        dgx: 0,
        dgy: 0,
        cells: [],
        maxCells: 0
      };
      var apple = {
        gx: 0,
        gy: 0
      };

      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min)) + min;
      }

      function initGame() {
        console.log('Initializing game...');
        snake.gx = Math.floor(cols / 2);
        snake.gy = Math.floor(rows / 2);
        snake.dgx = 1;
        snake.dgy = 0;
        snake.cells = [];
        snake.maxCells = 4;
        score = 0;
        firstMove = true;
        do {
          apple.gx = getRandomInt(0, cols);
          apple.gy = getRandomInt(0, rows);
        } while (snake.cells.some(cell => cell.gx === apple.gx && cell.gy === apple.gy));
        console.log('Game initialized: snake at', snake.gx, snake.gy, 'apple at', apple.gx, apple.gy);
      }

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        grid = 15;
        var newCols = Math.floor(canvas.width / grid);
        var newRows = Math.floor(canvas.height / grid);
        if (gameState === 'playing') {
          snake.gx = Math.max(0, Math.min(snake.gx, newCols - 1));
          snake.gy = Math.max(0, Math.min(snake.gy, newRows - 1));
          snake.cells = snake.cells.map(cell => ({
            gx: Math.max(0, Math.min(cell.gx, newCols - 1)),
            gy: Math.max(0, Math.min(cell.gy, newRows - 1))
          }));
          apple.gx = Math.max(0, Math.min(apple.gx, newCols - 1));
          apple.gy = Math.max(0, Math.min(apple.gy, newRows - 1));
        }
        cols = newCols;
        rows = newRows;
        console.log('Canvas resized: width=', canvas.width, 'height=', canvas.height, 'cols=', cols, 'rows=', rows);
      }

      function drawGameElements() {
        context.fillStyle = 'green';
        context.fillRect(apple.gx * grid, apple.gy * grid, grid - 1, grid - 1);

        context.fillStyle = 'black';
        snake.cells.forEach(function (cell) {
          context.fillRect(cell.gx * grid, cell.gy * grid, grid - 1, grid - 1);
        });
      }

      function loop() {
        try {
          if (gameState !== 'playing') {
            context.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'gameover') {
              drawGameElements();
            }

            context.textAlign = 'center';
            context.textBaseline = 'middle';
            var centerX = canvas.width / 2;
            var centerY = canvas.height / 2;

            if (gameState === 'start') {
              context.fillStyle = 'black'; // Black text for start screen
              context.font = grid + 'px Snake, Arial';
              context.fillText('Tap/Swipe or Arrow Keys to Play', centerX, centerY);
            } else if (gameState === 'gameover') {
              context.fillStyle = 'rgba(0, 0, 0, 0.7)';
              context.fillRect(0, 0, canvas.width, canvas.height);

              context.fillStyle = 'white';
              context.font = Math.floor(grid * 1.5) + 'px Snake, Arial';
              context.fillText('Game Over', centerX, centerY - grid * 2);
              context.font = Math.floor(grid * 1) + 'px Snake, Arial';
              context.fillText('Score: ' + score, centerX, centerY);
              context.font = Math.floor(grid * 0.8) + 'px Snake, Arial';
              context.fillText('Tap/Swipe or Arrow Keys to Restart', centerX, centerY + grid * 2);
            }
            return;
          }

          context.clearRect(0, 0, canvas.width, canvas.height);

          snake.gx += snake.dgx;
          snake.gy += snake.dgy;

          if (snake.gx < 0) {
            snake.gx = cols - 1;
          } else if (snake.gx >= cols) {
            snake.gx = 0;
          }

          if (snake.gy < 0) {
            snake.gy = rows - 1;
          } else if (snake.gy >= rows) {
            snake.gy = 0;
          }

          snake.cells.unshift({ gx: snake.gx, gy: snake.gy });

          if (snake.cells.length > snake.maxCells) {
            snake.cells.pop();
          }

          context.fillStyle = 'green';
          context.fillRect(apple.gx * grid, apple.gy * grid, grid - 1, grid - 1);

          context.fillStyle = 'black';
          var gameOverTriggered = false;
          snake.cells.forEach(function (cell, index) {
            context.fillRect(cell.gx * grid, cell.gy * grid, grid - 1, grid - 1);

            if (cell.gx === apple.gx && cell.gy === apple.gy) {
              snake.maxCells++;
              score++;
              do {
                apple.gx = getRandomInt(0, cols);
                apple.gy = getRandomInt(0, rows);
              } while (snake.cells.some(c => c.gx === apple.gx && c.gy === apple.gy));
            }

            for (var i = index + 1; i < snake.cells.length; i++) {
              if (cell.gx === snake.cells[i].gx && cell.gy === snake.cells[i].gy) {
                gameState = 'gameover';
                gameOverTriggered = true;
                console.log('Game over: Snake collided with itself');
                break;
              }
            }

            if (gameOverTriggered) return;
          });
          console.log('Game loop: snake at', snake.gx, snake.gy, 'score:', score);
        } catch (error) {
          console.error('Error in game loop:', error);
        }
      }

      document.addEventListener('keydown', function (e) {
        if (gameState !== 'playing') {
          initGame();
          gameState = 'playing';
        }

        if (e.which === 37 && (firstMove || snake.dgx === 0)) {
          snake.dgx = -1;
          snake.dgy = 0;
          firstMove = false;
        } else if (e.which === 38 && (firstMove || snake.dgy === 0)) {
          snake.dgy = -1;
          snake.dgx = 0;
          firstMove = false;
        } else if (e.which === 39 && (firstMove || snake.dgx === 0)) {
          snake.dgx = 1;
          snake.dgy = 0;
          firstMove = false;
        } else if (e.which === 40 && (firstMove || snake.dgy === 0)) {
          snake.dgy = 1;
          snake.dgx = 0;
          firstMove = false;
        }
      });

      var touchStart = { x: 0, y: 0 };

      document.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1) return;
        e.preventDefault();
        var touch = e.touches[0];
        touchStart.x = touch.clientX;
        touchStart.y = touch.clientY;

        if (gameState === 'start' || gameState === 'gameover') {
          initGame();
          gameState = 'playing';
        }
      }, { passive: false });

      document.addEventListener('touchmove', function (e) {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchend', function (e) {
        e.preventDefault();
        if (e.changedTouches.length === 0) return;
        if (gameState !== 'playing') return;

        var touch = e.changedTouches[0];
        var deltaX = touch.clientX - touchStart.x;
        var deltaY = touch.clientY - touchStart.y;

        var absDX = Math.abs(deltaX);
        var absDY = Math.abs(deltaY);

        if (absDX > absDY && absDX > 50) {
          if (deltaX > 0) {
            if (firstMove || snake.dgx === 0) {
              snake.dgx = 1;
              snake.dgy = 0;
              firstMove = false;
            }
          } else {
            if (firstMove || snake.dgx === 0) {
              snake.dgx = -1;
              snake.dgy = 0;
              firstMove = false;
            }
          }
        } else if (absDY > absDX && absDY > 50) {
          if (deltaY < 0) {
            if (firstMove || snake.dgy === 0) {
              snake.dgy = -1;
              snake.dgx = 0;
              firstMove = false;
            }
          } else {
            if (firstMove || snake.dgy === 0) {
              snake.dgy = 1;
              snake.dgx = 0;
              firstMove = false;
            }
          }
        }
      }, { passive: false });

      document.fonts.load('1em Snake').then(() => {
        console.log('Font "Snake" loaded successfully');
        resizeCanvas();
        initGame();
        setInterval(loop, 1000 / 20);
      }).catch(error => {
        console.error('Failed to load Snake font:', error);
        resizeCanvas();
        initGame();
        setInterval(loop, 1000 / 20);
      });

      window.addEventListener('resize', resizeCanvas);
    </script>
  </body>

</html>
