<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Phone Frame Video with External Text</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .phone-frame {
            width: 320px;
            height: 640px;
            background: #000;
            border: 10px solid #333;
            border-radius: 40px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            width: 60px;
            height: 10px;
            border-radius: 5px;
            transform: translateX(-50%);
            z-index: 2;
        }
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .vertical-text {
            position: absolute;
            left: -120px; /* Further outside the phone frame */
            top: 50%;
            transform: rotate(-90deg) translateY(-50%);
            transform-origin: center;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
            font-size: 16px;
            white-space: nowrap;
        }
        @media (max-width: 400px) {
           phone-frame {
        width: 75vw;
        border: 2.5vw solid #333;
        border-radius: 5vw;
        }

            .phone-frame::before {
                top: 2vw;
                width: 15vw;
                height: 1vw;
                border-radius: 1vw;
            }
            .vertical-text {
                left: -30vw; /* Adjusted for smaller screens */
                font-size: 4vw;
            }
        }
        @media (min-width: 401px) and (max-width: 600px) {
            .phone-frame {
                width: 300px;
                height: 600px;
                border: 8px solid #333;
                border-radius: 35px;
            }
            .phone-frame::before {
                top: 15px;
                width: 50px;
                height: 8px;
            }
            .vertical-text {
                left: -110px; /* Adjusted for medium screens */
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-frame">
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="video.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
        <div class="vertical-text">Appdadz' Store Product demo</div>
    </div>
</body>
</html>
