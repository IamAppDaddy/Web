<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>App Showcase</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f5f5f5;
            }

       

            .image-block {
                width: 100%;
                overflow: hidden;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }

            .image-block img {
                width: 100%;
                height: auto;
                display: block;
            }

            /* On larger screens center and limit max width */
            @media (min-width: 768px) {
                #gallery {
                    padding: 0;
                    /* remove side space on desktop */
                }

                .image-block {
                    max-width: 1200px;
                    margin: 20px auto;
                }
            }
        </style>
    </head>

    <body>

        <div id="gallery"></div>

        <script>
            // Array of images
            const images = [
                "1.webp",
                "2.webp",
                "3.webp",
                "4.webp",
                "5.webp",
                "6.webp",
                "7.webp",
                "8.webp",
                "9.webp"
            ];

            const gallery = document.getElementById("gallery");

            images.forEach(url => {
                const block = document.createElement("div");
                block.className = "image-block";

                const img = document.createElement("img");
                img.src = url;
                img.alt = "App Showcase";

                block.appendChild(img);
                gallery.appendChild(block);
            });
        </script>

    </body>

</html>
