<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Animating Lottie</title>
        <style>
            body {
                margin: 0;
                background: #f4f4f9;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            #preview {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                max-width: 1200px;
                width: 100%;
            }

            .cell {
                background: #fff;
                border: 1px solid #e0e0e0;
                display: flex;
                min-height: 200px;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                box-sizing: border-box;
            }

            dotlottie-player,
            img {
                width: 90%;
                height: 90%;
                object-fit: contain;
            }
        </style>
    </head>

    <body>
        <div id="preview">
            <div class="cell"><dotlottie-player src="1.lottie" autoplay loop></dotlottie-player></div>
