<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Screenshots Carousel</title>
        <style>
            :root {
                --gap: 16px;
                --edge-padding: 32px;
                /* Added extra space at start and end */
            }

            body {
                margin: 0;
                padding: 0;
                background: #89301c;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                height: 100vh;
                max-width: 100%;
                margin-left: auto;
                margin-right: auto;
                display: flex;
                align-items: center;
                overflow: hidden;
            }

            #preview {
                display: flex;
                align-items: center;
                gap: var(--gap);
                width: 100%;
                height: 100%;
                overflow-x: auto;
                scroll-behavior: smooth;
                /* Remove iOS momentum scrolling */
                -webkit-overflow-scrolling: auto;
                scroll-snap-type: x mandatory;
                scroll-padding: 0 calc(var(--edge-padding));
                padding-left: var(--edge-padding);
                padding-right: var(--edge-padding);
            }

            .cell {
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                justify-content: center;
                scroll-snap-align: center;
                /* Force browser to snap even with high momentum */
                scroll-snap-stop: always;
            }


            .cell img {
                display: block;
                max-height: 90vh;
                width: auto;
                object-fit: contain;
                border-radius: 30px;
                box-shadow: 0px 0px 55px rgba(0, 0, 0, 0.150);
                max-width: 100%;
            }

            #preview::-webkit-scrollbar {
                height: 8px;
            }

            #preview::-webkit-scrollbar-thumb {
                border-radius: 999px;
                background: rgba(0, 0, 0, 0.12);
            }
        </style>
    </head>

    <body>
        <div id="preview">
            <div class="cell"><img src="1.png" alt="Screenshot 1"></div>
            <div class="cell"><img src="2.png" alt="Screenshot 2"></div>
            <div class="cell"><img src="3.png" alt="Screenshot 3"></div>
            <div class="cell"><img src="4.png" alt="Screenshot 4"></div>
            <div class="cell"><img src="5.png" alt="Screenshot 5"></div>
            <div class="cell"><img src="6.png" alt="Screenshot 6"></div>
            <div class="cell"><img src="7.png" alt="Screenshot 7"></div>
            <div class="cell"><img src="8.png" alt="Screenshot 8"></div>
        </div>
        <script>
            (function () {
                const preview = document.getElementById('preview');
                const cells = preview.querySelectorAll('.cell');
                let isScrolling = null;

                function setEdgePadding() {
                    if (!cells.length) return;
                    const containerWidth = preview.clientWidth;
                    const cellWidth = cells[0].getBoundingClientRect().width;
                    const padding = Math.max(0, (containerWidth - cellWidth) / 2);
                    preview.style.paddingLeft = `calc(${padding}px + var(--edge-padding))`;
                    preview.style.paddingRight = `calc(${padding}px + var(--edge-padding))`;
                }

                function snapToNearest() {
                    const scrollLeft = preview.scrollLeft;
                    const containerWidth = preview.clientWidth;
                    let closestCell = null;
                    let minDistance = Infinity;

                    cells.forEach(cell => {
                        const cellLeft = cell.offsetLeft;
                        const distance = Math.abs(scrollLeft + containerWidth / 2 - (cellLeft + cell.clientWidth / 2));
                        if (distance < minDistance) {
                            minDistance = distance;
                            closestCell = cell;
                        }
                    });

                    if (closestCell) {
                        const targetLeft = closestCell.offsetLeft - (preview.clientWidth - closestCell.clientWidth) / 2;
                        preview.scrollTo({ left: targetLeft, behavior: 'smooth' });
                    }
                }

                // Snap immediately on scroll end
                preview.addEventListener('scroll', () => {
                    clearTimeout(isScrolling);
                    isScrolling = setTimeout(snapToNearest, 60); // Faster response
                });


                function debounceScroll() {
                    clearTimeout(isScrolling);
                    isScrolling = setTimeout(snapToNearest, 150);
                }

                function waitImagesThenInit() {
                    const imgs = preview.querySelectorAll('img');
                    const imgArray = Array.from(imgs);
                    const unloaded = imgArray.filter(i => !i.complete);
                    if (unloaded.length === 0) {
                        setEdgePadding();
                        preview.scrollTo({ left: 0, behavior: 'auto' });
                        return;
                    }
                    let loadedCount = 0;
                    unloaded.forEach(img => {
                        img.addEventListener('load', () => {
                            if (++loadedCount === unloaded.length) {
                                setEdgePadding();
                                preview.scrollTo({ left: 0, behavior: 'auto' });
                            }
                        });
                        img.addEventListener('error', () => {
                            if (++loadedCount === unloaded.length) {
                                setEdgePadding();
                                preview.scrollTo({ left: 0, behavior: 'auto' });
                            }
                        });
                    });
                    setTimeout(() => {
                        setEdgePadding();
                        preview.scrollTo({ left: 0, behavior: 'auto' });
                    }, 1200);
                }

                window.addEventListener('resize', setEdgePadding);
                preview.addEventListener('scroll', debounceScroll);
                preview.addEventListener('click', e => {
                    const cell = e.target.closest('.cell');
                    if (!cell) return;
                    const left = cell.offsetLeft - (preview.clientWidth - cell.clientWidth) / 2;
                    preview.scrollTo({ left, behavior: 'smooth' });
                });

                document.readyState === 'complete' || document.readyState === 'interactive'
                    ? waitImagesThenInit()
                    : document.addEventListener('DOMContentLoaded', waitImagesThenInit);
            })();
        </script>
    </body>

</html>
