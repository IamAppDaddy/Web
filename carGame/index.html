<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Infinite Car Driving Game</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                font-family: Arial, sans-serif;
                background-color: #000;
            }

            #score {
                position: absolute;
                top: 10px;
                left: 10px;
                font-size: 24px;
                color: white;
                z-index: 1;
                background-color: rgba(0, 0, 0, 0.5);
                padding: 5px 10px;
                border-radius: 5px;
            }

            #instructions {
                position: absolute;
                top: 10px;
                right: 10px;
                font-size: 14px;
                color: white;
                z-index: 1;
                background-color: rgba(0, 0, 0, 0.5);
                padding: 5px 10px;
                border-radius: 5px;
                text-align: center;
            }

            #gameOver {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 48px;
                color: red;
                background-color: rgba(0, 0, 0, 0.8);
                padding: 20px;
                border-radius: 10px;
                display: none;
                z-index: 2;
                text-align: center;
            }

            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 24px;
                color: white;
                z-index: 3;
            }
        </style>
    </head>

    <body>
        <div id="score">Distance: 0m</div>
        <div id="instructions">Use A/D or Arrow Keys to steer</div>
        <div id="gameOver">Game Over!<br>Final Distance: 0m</div>
        <div id="loading">Loading car model...</div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
        <script>
            // Fallback if Three.js fails to load
            if (typeof THREE === 'undefined') {
                alert('Failed to load Three.js. Please check your internet connection or try again later.');
                throw new Error('Three.js not loaded');
            }

            // Fallback if GLTFLoader fails to load
            if (typeof THREE.GLTFLoader === 'undefined') {
                alert('Failed to load GLTFLoader. Please check your internet connection or try again later.');
                throw new Error('GLTFLoader not loaded');
            }

            // Scene setup
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.fog = new THREE.Fog(0x87ceeb, 20, 100); // Fog to hide popping objects
            scene.fog = new THREE.Fog(0x87ceeb, 20, 100); // Match renderer and scene fog
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Sky
            scene.background = new THREE.Color(0x87ceeb);

            // Ground (grass on sides)
            const groundGeometry = new THREE.PlaneGeometry(20, 200);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x228b22 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -100;
            ground.receiveShadow = true;
            scene.add(ground);

            // Road
            const roadWidth = 6;
            const roadLength = 20;
            const roadSegments = [];
            const laneMarkers = [];

            function createRoadSegment(z) {
                // Road segment
                const roadGeometry = new THREE.PlaneGeometry(roadWidth, roadLength);
                const roadMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
                const road = new THREE.Mesh(roadGeometry, roadMaterial);
                road.rotation.x = -Math.PI / 2;
                road.position.z = z;
                road.position.y = 0.01; // Slightly above ground to avoid z-fighting
                road.receiveShadow = true;
                scene.add(road);
                roadSegments.push(road);

                // Lane markers
                const markerGeometry = new THREE.PlaneGeometry(0.2, 2);
                const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Yellow for visibility
                const leftMarker = new THREE.Mesh(markerGeometry, markerMaterial);
                leftMarker.rotation.x = -Math.PI / 2;
                leftMarker.position.set(-1.5, 0.02, z + roadLength / 2);
                scene.add(leftMarker);
                laneMarkers.push(leftMarker);

                const rightMarker = new THREE.Mesh(markerGeometry, markerMaterial);
                rightMarker.rotation.x = -Math.PI / 2;
                rightMarker.position.set(1.5, 0.02, z + roadLength / 2);
                scene.add(rightMarker);
                laneMarkers.push(rightMarker);
            }

            // Generate initial road (more segments for smoother fog transition)
            for (let i = 0; i < 15; i++) {
                createRoadSegment(i * -roadLength);
            }

            // Load car model from GLTF
            let car;
            const loader = new THREE.GLTFLoader();
            loader.load(
                'https://iamappdaddy.github.io/Web/carGame/scene.gltf',
                function (gltf) {
                    car = gltf.scene;
                    car.position.set(0, 0, 0);
                    car.scale.set(0.5, 0.5, 0.5); // Adjust scale as needed for the model
                    car.rotation.y = Math.PI; // Rotate if needed to face forward
                    scene.add(car);

                    // Hide loading message
                    document.getElementById('loading').style.display = 'none';

                    // Start the game animation after loading
                    animate();
                },
                function (progress) {
                    console.log('Loading progress:', (progress.loaded / progress.total * 100) + '%');
                },
                function (error) {
                    console.error('Error loading GLTF:', error);
                    alert('Failed to load car model. Using fallback box car.');

                    // Fallback to box car
                    const carGeometry = new THREE.BoxGeometry(1, 0.5, 2);
                    const carMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });
                    car = new THREE.Mesh(carGeometry, carMaterial);
                    car.position.set(0, 0.25, 0);
                    car.castShadow = true;
                    scene.add(car);

                    document.getElementById('loading').style.display = 'none';
                    animate();
                }
            );

            // Load texture if needed (assuming GLTF has its own, but for custom application)
            // Note: If the GLTF model needs this texture, it might already reference it or need manual application
            const textureLoader = new THREE.TextureLoader();
            const carTexture = textureLoader.load('https://iamappdaddy.github.io/Web/carGame/BodyGlossy_baseColor.png');

            // Obstacles
            const obstacles = [];
            const lanes = [-2, 0, 2]; // Wider lanes

            class Obstacle {
                constructor() {
                    this.mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 1, 1),
                        new THREE.MeshLambertMaterial({ color: 0x0000ff })
                    );
                    this.mesh.position.x = lanes[Math.floor(Math.random() * lanes.length)];
                    this.mesh.position.y = 0.5;
                    this.mesh.position.z = -40;
                    this.mesh.castShadow = true;
                    scene.add(this.mesh);
                    obstacles.push(this);
                }

                update(gameSpeed) {
                    this.mesh.position.z += gameSpeed;
                }

                isPastCar() {
                    return this.mesh.position.z > 5;
                }
            }

            // Camera
            camera.position.set(0, 3, 6); // Adjusted for better view
            camera.lookAt(0, 0, 0);

            // Game variables
            let distance = 0;
            let gameSpeed = 0.1;
            let keys = {};
            let gameOver = false;
            const scoreDisplay = document.getElementById('score');
            const gameOverDisplay = document.getElementById('gameOver');

            // Controls
            document.addEventListener('keydown', (event) => {
                keys[event.key.toLowerCase()] = true;
                if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') keys.left = true;
                if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') keys.right = true;
            });

            document.addEventListener('keyup', (event) => {
                keys[event.key.toLowerCase()] = false;
                if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') keys.left = false;
                if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') keys.right = false;
            });

            function updateCar() {
                if (car && !gameOver) {
                    if (keys.left && car.position.x > -2.5) {
                        car.position.x -= 0.05;
                    }
                    if (keys.right && car.position.x < 2.5) {
                        car.position.x += 0.05;
                    }
                }
            }

            function checkCollisions() {
                if (!car) return;
                obstacles.forEach((obstacle, index) => {
                    if (Math.abs(obstacle.mesh.position.z - car.position.z) < 1.5 &&
                        Math.abs(obstacle.mesh.position.x - car.position.x) < 1.2) {
                        gameOver = true;
                        gameOverDisplay.innerHTML = `Game Over!<br>Final Distance: ${Math.floor(distance)}m`;
                        gameOverDisplay.style.display = 'block';
                    }
                });
            }

            function spawnObstacle() {
                if (Math.random() < 0.005 && obstacles.length < 3 && !gameOver) { // Lower spawn rate, limit active obstacles
                    new Obstacle();
                }
            }

            function animate() {
                if (gameOver || !car) {
                    if (!car) requestAnimationFrame(animate); // Wait for car to load
                    return;
                }

                requestAnimationFrame(animate);

                // Update distance and speed
                distance += gameSpeed;
                gameSpeed += 0.00005; // Slower speed increase for easier play
                scoreDisplay.textContent = `Distance: ${Math.floor(distance)}m`;

                // Update car
                updateCar();

                // Update obstacles
                obstacles.forEach((obstacle, index) => {
                    obstacle.update(gameSpeed);
                    if (obstacle.isPastCar()) {
                        scene.remove(obstacle.mesh);
                        obstacles.splice(index, 1);
                    }
                });

                // Move road segments
                roadSegments.forEach(segment => {
                    segment.position.z += gameSpeed;
                });
                const roadZs = roadSegments.map(s => s.position.z);
                const maxRoadZ = Math.max(...roadZs);
                if (maxRoadZ > 25) { // Higher threshold to avoid gaps
                    const minRoadZ = Math.min(...roadZs);
                    const segmentToRecycle = roadSegments.find(s => s.position.z === maxRoadZ);
                    if (segmentToRecycle) {
                        segmentToRecycle.position.z = minRoadZ - roadLength;
                    }
                }

                // Move lane markers
                laneMarkers.forEach(marker => {
                    marker.position.z += gameSpeed;
                });
                const markerZs = laneMarkers.map(m => m.position.z);
                const maxMarkerZ = Math.max(...markerZs);
                if (maxMarkerZ > 25) {
                    const minMarkerZ = Math.min(...markerZs);
                    // Recycle both left and right markers for the same segment
                    const leftMarkerToRecycle = laneMarkers.find(m => m.position.z === maxMarkerZ && m.position.x < 0);
                    const rightMarkerToRecycle = laneMarkers.find(m => m.position.z === maxMarkerZ && m.position.x > 0);
                    if (leftMarkerToRecycle) {
                        leftMarkerToRecycle.position.z = minMarkerZ - 20;
                    }
                    if (rightMarkerToRecycle) {
                        rightMarkerToRecycle.position.z = minMarkerZ - 20;
                    }
                }

                // Move ground
                ground.position.z += gameSpeed;
                if (ground.position.z > 0) {
                    ground.position.z -= 200;
                }

                // Camera follows car
                camera.position.x = car.position.x * 0.5;
                camera.position.z = car.position.z + 6;
                camera.lookAt(car.position.x, 0.5, car.position.z);

                // Spawn obstacles
                spawnObstacle();

                // Check collisions
                checkCollisions();

                renderer.render(scene, camera);
            }

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Initial render while loading
            renderer.render(scene, camera);
        </script>
    </body>

</html>
